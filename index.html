function compare(cmp, num){
  return (
    num >= cmp[0]
      &&
    num <  cmp[1]
  );
}
function updateScreen(){
  const ms = Math.floor(prop.ms * 10);
  const m = (prop.hr < 12) ? "AM" : "PM";
  MMHH.innerText = ((prop.hr % 12) || 12).toString().padStart(2,"0") + ":" + prop.mn.toString().padStart(2,"0");
    SS.innerText = prop.sc.toString().padStart(2,"0");
     M.innerText = m;
  for( const state of [preCmp, ...Object.keys(preset.normal)] ){
    if(compare(preset.normal[state].cmp, prop.time)){
      remainder = {};
      updateProp(remainder, 
        new Date(
          (preset.normal[state].cmp[1] - prop.time)
          + tzOff
        )
      );
      
      preCmp = state;
      return preset.normal[state].action(prop, remainder);
    }else{
      console.log(preset.normal[state]);
    }
  }
  return alert("Something went wrong! Are you quantum? "+prop.time)
}
function updateProp(obj, date){
  const yr = date.getYear();
  const mo = date.getMonth();
  obj.yr = 1900 + yr; //shortened prop.yr % 100
  obj.mo = date.getMonth() + 1;
  obj.dy = date.getDate();
  obj.d = d[date.getDay()];
  obj.hr = date.getHours(); //shortened (prop.hr % 12) || 12
  obj.mn = date.getMinutes();
  obj.sc = date.getSeconds();
  obj.ms = date.getMilliseconds();
  obj.time = (obj.hr * 60 * 60 * 1000) + (obj.mn * 60 * 1000) + (obj.sc * 1000) + obj.ms;
}
