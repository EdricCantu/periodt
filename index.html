function updateProp(date){

  const mo = date.getMonth();
  prop.yr = 1900 + yr; //shortened prop.yr % 100

  prop.dy = date.getDate();
  prop.d = d[date.getDay()];
  prop.hr = date.getHours(); //shortened (prop.hr % 12) || 12
  prop.mn = date.getMinutes();
  prop.sc = date.getSeconds();
  prop.ms = date.getMilliseconds();
  prop.time = (prop.hr * 60 * 60 * 1000) + (prop.mn * 60 * 1000) + (prop.sc * 1000) + prop.ms;
