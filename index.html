<!DOCTYPE html> 
<html>
  <head></head>
  <body>
    <canvas id="can" width="800" height="550" style="border: 1px solid black"></canvas>
  </body>
  <!--systoff --- 
    (tddisplay is offset by <systoff>, when using <reference> as a reference)
      if tddisplay more ahead, put number closer to positive infinity. (more ahead, more positive)
      if reference more ahead, put number closer to negative infinity. (more behind, more negative)
    -->
  <!--offset ---
    (bell clock is offset by <offset>, when using <reference> as a reference) 
      the offsets of the times the bell actually rings, compared to the times its supposed to ring.
      negative means first bell rings sometime before 8:40
      positive means first bell rings sometime after 8:40
    -->
  <script>
    const params = new URLSearchParams(window.location.search);
    const systoff = parseInt(params.get("systoff") || "0");

    function nowDate() {
      return new Date(Date.now() - systoff);
    }
    function formatRemaining(ms) {//formatting, and use so that 1 second means 1 second or less. when zero, it immediately flashes.
      var totalSeconds = Math.ceil(ms / 1000);
      if (totalSeconds < 1) totalSeconds = 1;

      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return minutes+":"+(seconds.toString().padStart(2,"0"));
    }

    function splitText(text, splitX, leftColor, rightColor){
      ctx.save();

      ctx.font = "60px Arial";
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";

      // Total width of the text
      const w = ctx.measureText(text).width;

      // Left edge of centered text at x = 400
      const startX = 400 - w / 2;
      const y = 462.5;

      // Clamp splitX so it doesn't do weird things
      splitX = Math.max(0, Math.min(800, splitX));

      // How much of the text is left of the split line
      const leftWidth = Math.max(0, Math.min(w, splitX - startX));

      // Draw left color
      if (leftWidth > 0){
        ctx.save();
        ctx.beginPath();
        ctx.rect(startX, y - 40, leftWidth, 80); // clip to left section
        ctx.clip();
        ctx.fillStyle = leftColor;
        ctx.fillText(text, startX, y);
        ctx.restore();
      }
      if (leftWidth < w){
        ctx.save();
        ctx.beginPath();
        ctx.rect(startX + leftWidth, y - 40, w - leftWidth, 80); // clip to right section
        ctx.clip();
        ctx.fillStyle = rightColor;
        ctx.fillText(text, startX, y);
        ctx.restore();
      }

      ctx.restore();
    }

    ctx = can.getContext("2d");
    months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],
    days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"]
    //time
    h24 = false;

    offset = 12500;
    t = 0;
    times = [
      "00:00",
      "08:40",
      "08:45",
      "09:30",
      "09:35",
      "10:20",
      "10:25",
      "11:10",
      "11:15",
      "12:00",
      "12:05",
      "12:50",
      "12:55",
      "13:40",
      "13:45",
      "14:30",
      "14:35",
      "15:20",
      "15:25",
      "16:10",
    ];

    for(const i in times){
      times[i] = times[i].split(":").map(num=>parseInt(num));
      times[i] = (times[i][0] * 3600 + times[i][1] * 60) * 1000 + offset;
    }
    function draw(){
      ctx.fillStyle = "white";
      ctx.fillRect(0,0,800,500);
      ctx.fillStyle = "black";
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.font = "250px monospace";
      date = nowDate();
      th = (date.getHours() % (h24 ? 24 : 12));
      if(!(h24 || th)) th = 12
      th = th.toString().padStart(2,0);
      t2 = (date.getHours() > 11)?"PM":"AM";
      tm = date.getMinutes();
      tm = tm.toString().padStart(2,0);
      ts = date.getSeconds()
      ts = ts.toString().padStart(2,0);
      tl = date.getMilliseconds();//little
      dm = date.getMonth() + 1;
      dm = dm.toString().padStart(2,0);
      dd = date.getDate();
      dd = dd.toString().padStart(2,0);
      dy = date.getFullYear().toString().substr(2);
      wc = ctx.measureText(tm).width / 2;
      ctx.fillText(th, 0, 120);
      if(tl < 500) ctx.fillText(":", wc*1.8, 100);
      ctx.fillText(tm, wc*2.6, 120);
      ctx.font = "75px monospace";
      ctx.fillText(ts, 695, 60)
      ctx.fillText(h24?"":t2, 695, 170);
      ctx.font = "150px monospace";
      ctx.textAlign = "center";
      ctx.fillText(`${dm}/${dd}/${dy}`,400,275);
      ctx.font = "90px Arial";
      ctx.fillText(months[date.getMonth()], 800*(1/6), 375);
      ctx.fillText(days[date.getDay()], 800*(2/3), 375);
      
      mc = ctx.measureText(months[date.getMonth()]).width / 2;
      dc = ctx.measureText(days[date.getDay()]).width / 2;
      mc = 800*(1/6) + mc;
      dc = 800*(2/3) - dc;
      (mc + dc) / 2;
      ctx.fillText("🞄", (mc + dc) / 2, 375);
      if(h24){//make milliseconds pie
        
      }
      if(drawPeriods) drawPeriods(date);

      requestAnimationFrame(draw);
    }
    draw()
    
    function drawPeriods(date){
      pcol = 0
        //      f00   f80    ff0   0f0  080  00f   0ff  80f     f0f
        //      red orange yellow lime green blue cyan purple magenta
        //black                                                       white
      colors   = ([0,"f00","f80","ff0","0f0","080","00f","0ff","80f","f0f"])
      uncolors =  [0,"fff","fff","000","000","fff","fff","000","fff","000"]
      time = date.getHours() * 3600000 + date.getMinutes() * 60000 + date.getSeconds() * 1000 + date.getMilliseconds();
      if(time > times[t+1]) t++;

      elapsed = ((time - times[t])/(times[t+1] - times[t])) * 800;
      percent = elapsed / 800
      if(!t){
        fillStyle = "black";
        if(time % 1000 > 500) ctx.fillRect(0,425,800,75);
        if(times[1] - time < 45*60*1000){
          ctx.font = "60px Arial";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillStyle = (time % 1000 > 500)? "white" : "black";
          us = times[1] - time;//until school
          ctx.fillText( formatRemaining(us)+` until school!`, 400, 462.5);
        }
      }else if(t%2){//between periods
        if(percent *5*60 < 5){ //if bell
          ctx.fillStyle = "#"+colors.slice((t/2)-0.5, (t/2)+1.5)[0 + (Math.floor(percent*5*60 * 4) % 2)]
          ctx.fillRect(0,425,elapsed,75);
          ctx.fillStyle = "#"+colors.slice((t/2)-0.5, (t/2)+1.5)[1 - (Math.floor(percent*5*60 * 4) % 2)]
          ctx.fillRect(elapsed,425,800-elapsed,75);
        }else{
          ctx.fillStyle = "#"+colors[(t/2)+0.5];
          ctx.fillRect(0,425,elapsed,75);
          ctx.fillStyle = "#"+colors[(t/2)-0.5];
          ctx.fillRect(elapsed,425,800-elapsed,75);
          ctx.font = "60px Arial";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillStyle = "white";
          splitText(
            formatRemaining((5*60*1000)*(1-percent))+` until ${[0,"1ˢᵗ","2ⁿᵈ","3ʳᵈ","4ᵗʰ","5ᵗʰ","6ᵗʰ","7ᵗʰ","8ᵗʰ","9ᵗʰ"][(t+1)/2]}`,
            elapsed, "#"+uncolors[(t/2)+0.5], "#"+uncolors[(t/2)-0.5]
          )
        }
      }else{
        ctx.fillStyle = "#"+colors[t/2];
        textcols = [];
        if(percent *45*60 < 5){ //if bell
          textcols = ["#000","#"+uncolors[t/2]]//check
          if(time % 500 > 250) ctx.fillRect(0,425,800,75);
        }else if(elapsed < 400){
          ctx.fillRect(elapsed,425,800-elapsed,75);
          textcols = ["#000", "#"+uncolors[t/2]]
        }else{
          ctx.fillRect(0,425,elapsed,75);
          textcols = ["#"+uncolors[t/2], "#000"]
        }
        ctx.font = "60px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        splitText(
          formatRemaining((45*60*1000)*(1-percent))+` left for ${[0,"1ˢᵗ","2ⁿᵈ","3ʳᵈ","4ᵗʰ","5ᵗʰ","6ᵗʰ","7ᵗʰ","8ᵗʰ","9ᵗʰ"][(t)/2]}`,
          elapsed, ...textcols
        )
      }
    }
  </script>
</html>
