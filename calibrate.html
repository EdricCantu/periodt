<html>
  <body>
    <span id="display" style="font-size: 32px; font-family: monospace">00:00:00</span>
    <br>
    <b>d &lt; r = sub || d > r = add </b>
    <br>
    <button id="a">-1000</button><button id="b">-100</button><button id="c">-10</button>
      -/+
    <button id="d">+10</button><button id="e">+100</button><button id="f">+1000</button>
    
    <br><br><br><br>
    
    <button title="start detecting bell">⏺️</button>
    <input type="time" placeholder="expected ringing time">
    <input type="number" placebolder="offset" disabled>
  </body>
  <script>
    systoff = 0;
    a.onclick = ()=>{systoff -= 1000}
    b.onclick = ()=>{systoff -= 100}
    c.onclick = ()=>{systoff -= 10}
    
    d.onclick = ()=>{systoff += 10}
    e.onclick = ()=>{systoff += 100}
    f.onclick = ()=>{systoff += 1000}
    function draw(){
      const date = new Date(Date.now() - systoff);
      display.innerHTML = 
        date.getHours().toString().padStart(2,0)
          + ":" +
        date.getMinutes().toString().padStart(2,0)
          + ":" +
        date.getSeconds().toString().padStart(2,0)
          +
        (  ((systoff >= 0)?"+":"")+systoff.toString()  )
          .sup().sup().sup().sub().sub();
      ;
      requestAnimationFrame(draw);
    }
    draw();
  </script>
</html>
