<html>
  <body>
    <span>systoff - </span><input id="esystoff" type="number" value="0" disabled>
    <br>
    <span>display - </span><span id="display" style="font-size: 32px; font-family: monospace">00:00</span>
    <br>
    <b>d &lt; r - </b><button id="a">⏮️</button><button id="b">⏪</button><button id="c">◀️</button>
    <br><br>
    <b>d &rt; r - </b><button id="d">▶️</button><button id="e">⏩</button><button id="f">⏭️</button>
    
    <br><br><br><br>
    
    <button title="start detecting bell">⏺️</button>
    <input type="time" placeholder="expected ringing time">
    <input type="number" placebolder="offset" disabled>
  </body>
  <script>
    systoff = 0;
    a.oninput = ()=>{systoff -= 1000}
    b.oninput = ()=>{systoff -= 100}
    c.oninput = ()=>{systoff -= 10}
    
    d.oninput = ()=>{systoff += 10}
    e.oninput = ()=>{systoff += 100}
    f.oninput = ()=>{systoff += 1000}
    function draw(){
      esystoff.value = systoff;
      const date = new Date(Date.now() - systoff);
      display.innerText = 
        date.getHours().toString().padStart(0,2)
          + ":" +
        date.getMinutes().toString().padStart(0,2)
          + ":" +
        date.getSeconds().toString().padStart(0,2)
      ;
      requestAnimationFrame(draw);
    }
    draw();
  </script>
</html>
