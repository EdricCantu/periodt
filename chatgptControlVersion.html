<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Goertzel Frequency Detector</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #111;
        color: #eee;
        padding: 20px;
    }
    .panel {
        max-width: 400px;
        background: #1e1e1e;
        padding: 15px;
        border-radius: 8px;
    }
    label {
        display: block;
        margin-top: 10px;
        font-size: 0.9em;
    }
    input, button {
        width: 100%;
        padding: 6px;
        margin-top: 4px;
        border-radius: 4px;
        border: none;
        font-size: 1em;
    }
    input[disabled] {
        background: #333;
        color: #aaa;
    }
    #meter {
        margin-top: 20px;
        height: 20px;
        background: #333;
        border-radius: 10px;
        overflow: hidden;
    }
    #level {
        height: 100%;
        width: 0%;
        background: lime;
        transition: width 0.05s linear;
    }
</style>
</head>
<body>

<div class="panel">
    <h2>Goertzel Detector</h2>

    <label>Target Frequency (Hz)</label>
    <input id="freqInput" type="number" value="1000" min="1">

    <label>Block Size (samples)</label>
    <input id="blockInput" type="number" value="1024" min="64" step="64">

    <label>Sample Rate</label>
    <input id="sampleRate" disabled>

    <label>Frequency Resolution (Hz)</label>
    <input id="resolution" disabled>

    <button id="startBtn">Start</button>

    <div id="meter">
        <div id="level"></div>
    </div>
</div>

<script>
let audioCtx;
let processor;
let source;

function goertzel(samples, freq, sampleRate) {
    const N = samples.length;
    const k = Math.round(0.5 + (N * freq) / sampleRate);
    const omega = (2 * Math.PI * k) / N;
    const coeff = 2 * Math.cos(omega);

    let s0 = 0, s1 = 0, s2 = 0;

    for (let i = 0; i < N; i++) {
        s0 = samples[i] + coeff * s1 - s2;
        s2 = s1;
        s1 = s0;
    }

    const power = s1 * s1 + s2 * s2 - coeff * s1 * s2;
    return Math.sqrt(power);
}

document.getElementById("startBtn").onclick = async () => {
    const freq = parseFloat(document.getElementById("freqInput").value);
    const blockSize = parseInt(document.getElementById("blockInput").value);

    if (audioCtx) return;

    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const sampleRate = audioCtx.sampleRate;

    document.getElementById("sampleRate").value = sampleRate.toFixed(0);
    document.getElementById("resolution").value =
        (sampleRate / blockSize).toFixed(2);

    source = audioCtx.createMediaStreamSource(stream);

    processor = audioCtx.createScriptProcessor(blockSize, 1, 1);

    processor.onaudioprocess = (event) => {
        const input = event.inputBuffer.getChannelData(0);

        const magnitude = goertzel(input, freq, sampleRate);

        // Simple normalization for display
        const level = Math.min(1, magnitude / 50);

        document.getElementById("level").style.width =
            (level * 100) + "%";
    };

    source.connect(processor);
    processor.connect(audioCtx.destination);
};
</script>

</body>
</html>
