<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Goertzel Frequency Detector</title>
<style>
  body { font-family: Arial, sans-serif; padding: 20px; }
  label { display: block; margin-top: 10px; }
  input { width: 150px; }
  #status { margin-top: 20px; font-size: 20px; }
</style>
</head>
<body>

<h2>Goertzel Frequency Detector</h2>

<label>
  Target Frequency (Hz):
  <input id="freq" type="number" value="1000">
</label>

<label>
  Block Size (samples):
  <input id="block" type="number" value="1024">
</label>

<label>
  Sample Rate:
  <input id="sampleRate" type="text" disabled>
</label>

<label>
  Frequency Resolution (Hz):
  <input id="resolution" type="text" disabled>
</label>

<br>
<button id="start">Start</button>

<div id="status">Status: idle</div>
<div id="power">Power: 0</div>
<div id="noise">Noise floor: 0</div>

<script>
let audioContext;
let processor;
let sampleRate;
let blockSize = 1024;
let targetFreq = 1000;

let noiseFloor = 1e-6;
const noiseSmoothing = 0.98;
const detectionRatio = 5; // signal must be 5x noise

document.getElementById("start").onclick = async () => {
  targetFreq = parseFloat(document.getElementById("freq").value);
  blockSize = parseInt(document.getElementById("block").value);

  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

  audioContext = new (window.AudioContext || window.webkitAudioContext)();
  sampleRate = audioContext.sampleRate;

  document.getElementById("sampleRate").value = sampleRate.toFixed(0);
  document.getElementById("resolution").value = (sampleRate / blockSize).toFixed(2);

  const source = audioContext.createMediaStreamSource(stream);
  processor = audioContext.createScriptProcessor(blockSize, 1, 1);

  source.connect(processor);
  processor.connect(audioContext.destination);

  processor.onaudioprocess = (e) => {
    const input = e.inputBuffer.getChannelData(0);
    const power = goertzel(input, targetFreq, sampleRate);

    // update noise floor
    noiseFloor = noiseFloor * noiseSmoothing +
                 power * (1 - noiseSmoothing);

    const detected = power > noiseFloor * detectionRatio;

    document.getElementById("power").textContent =
      "Power: " + power.toFixed(4);
    document.getElementById("noise").textContent =
      "Noise floor: " + noiseFloor.toFixed(4);
    document.getElementById("status").textContent =
      "Status: " + (detected ? "DETECTED" : "listening...");
  };
};

function goertzel(samples, targetFreq, sampleRate) {
  const N = samples.length;
  const k = Math.round(0.5 + (N * targetFreq) / sampleRate);
  const omega = (2 * Math.PI * k) / N;
  const coeff = 2 * Math.cos(omega);

  let q0 = 0, q1 = 0, q2 = 0;

  for (let i = 0; i < N; i++) {
    q0 = coeff * q1 - q2 + samples[i];
    q2 = q1;
    q1 = q0;
  }

  const real = q1 - q2 * Math.cos(omega);
  const imag = q2 * Math.sin(omega);
  return real * real + imag * imag;
}
</script>

</body>
</html>
